name: cyber-vulndb-update

# Daily refresh of the BOD 26-04 vulnerability database (Cyber/).
#
# State lives in the Actions cache rather than the repo: the DuckDB file runs to hundreds of MB
# and the repo's pre-commit hook rejects anything over 500 KB. Each run restores the newest cache
# entry, updates it, and saves under a fresh key -- cache entries are immutable, so the run id
# makes the key unique and `restore-keys` finds the most recent previous one.

on:
  schedule:
    # 15:00 UTC: EPSS publishes the day's scores shortly after 13:30 UTC, so this run always
    # picks up the current file rather than yesterday's.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "init rebuilds the whole corpus from scratch (hours); update is incremental"
        type: choice
        options: [update, init]
        default: update

concurrency:
  # Two runs writing the same DuckDB file would corrupt it.
  group: cyber-vulndb
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # a full init pages through ~380k CVEs
    defaults:
      run:
        working-directory: Cyber

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up environment
        run: |
          uv venv --python 3.13
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Restore database cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: Cyber/data/cyber.duckdb
          key: vulndb-${{ github.run_id }}
          restore-keys: vulndb-

      - name: Update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr for the Vulnrichment diff.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workflow expressions are bound to env rather than interpolated into the script, so
          # nothing from the event context can be parsed as shell.
          CACHE_HIT: ${{ steps.cache.outputs.cache-matched-key }}
          MODE: ${{ inputs.mode }}
        run: |
          # No cached database means there is nothing to update incrementally -- fall back to a
          # full load so a cache eviction degrades into a slow run, not a failed one.
          if [ -z "$CACHE_HIT" ] || [ "$MODE" = "init" ]; then
            echo "::notice::no cached database (or init requested) -- running full init"
            .venv/bin/python -m vulndb init
          else
            .venv/bin/python -m vulndb update
          fi

      - name: Status
        run: .venv/bin/python -m vulndb status | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Export Parquet
        run: .venv/bin/python -m vulndb export

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Cyber/data/cyber.duckdb
          key: vulndb-${{ github.run_id }}

      # Two artifacts rather than one: the Parquet exports are small enough to keep around, while
      # the full database runs to ~1 GB and only the most recent copy is ever worth downloading.
      - name: Upload Parquet exports
        uses: actions/upload-artifact@v4
        with:
          name: cyber-vulndb-parquet-${{ github.run_id }}
          path: Cyber/data/export/*.parquet
          retention-days: 90

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: cyber-vulndb-${{ github.run_id }}
          path: Cyber/data/cyber.duckdb
          retention-days: 14
          compression-level: 6
