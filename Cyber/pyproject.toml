[project]
name = "vulndb"
version = "0.1.0"
description = "BOD 26-04 vulnerability prioritization database (NVD + KEV + Vulnrichment + EPSS)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulndb"]
